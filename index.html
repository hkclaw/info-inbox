<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>info-inbox</title>
  <style>
    :root { color-scheme: dark; --bg:#111; --card:#1c1c1e; --line:#333; --text:#f2f2f7; --muted:#8e8e93; --acc:#0a84ff; --warn:#ffd60a; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font: 15px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 16px 16px 0; max-width: 720px; margin: 0 auto; }
    h1 { font-size: 22px; font-weight: 650; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 12px; }
    nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    nav button { padding: 8px 12px; border: 0; border-radius: 8px; font: inherit; cursor: pointer; background: #2c2c2e; color: var(--text); }
    nav button.on { background: var(--acc); color: #fff; font-weight: 600; }
    main { max-width: 720px; margin: 0 auto; padding: 0 16px 80px; }
    section { display: none; }
    section.on { display: block; }
    textarea, input[type=search] { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #000; color: var(--text); font: inherit; }
    textarea { min-height: 180px; resize: vertical; }
    .row { margin-top: 8px; display: flex; gap: 8px; }
    button.go { padding: 10px 16px; border: 0; border-radius: 8px; background: var(--acc); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button.dim { padding: 10px 16px; border: 0; border-radius: 8px; background: #2c2c2e; color: var(--text); font: inherit; cursor: pointer; }
    .empty { color: var(--muted); padding: 24px 4px; }
    .err { color: var(--warn); margin: 8px 0; }
    article { background: var(--card); border-radius: 12px; padding: 12px; margin: 8px 0; }
    article .meta { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    article pre { white-space: pre-wrap; margin: 0; font: inherit; }
    .tag { display: inline-block; margin-right: 6px; color: var(--acc); font-size: 12px; background: none; border: 0; padding: 0; font: inherit; cursor: pointer; }
    .tag.on { text-decoration: underline; }
    button.del { padding: 8px 12px; border: 0; border-radius: 8px; background: #2c2c2e; color: #ff453a; font: inherit; cursor: pointer; }
    #noteFilter { color: var(--muted); margin: 0 0 8px; }
    .sum { font-weight: 600; margin: 0 0 6px; white-space: pre-wrap; }
  </style>
</head>
<body>
<header>
  <h1>info-inbox</h1>
  <p class="sub">本機 inbox。資料只存呢部機。分類用本機 Ollama llama3.2。</p>
  <nav>
    <button type="button" data-tab="dump" class="on">Dump</button>
    <button type="button" data-tab="notes">Notes</button>
    <button type="button" data-tab="search">Search</button>
    <button type="button" data-tab="pending">Pending</button>
    <button type="button" data-tab="merge">Merge</button>
  </nav>
</header>
<main>
  <section id="dump" class="on">
    <textarea id="dumpText" placeholder="貼一大段文字"></textarea>
    <div class="row"><button class="go" type="button" id="dumpGo">存入</button></div>
    <p id="dumpMsg" class="err" hidden></p>
  </section>
  <section id="notes">
    <p id="noteFilter" hidden><span id="noteFilterLabel"></span> <button type="button" class="dim" id="noteFilterClear">清篩選／顯示全部</button></p>
    <div id="notesList" class="empty">未有筆記。</div>
  </section>
  <section id="search">
    <form id="searchForm">
      <input type="search" id="q" placeholder="關鍵字" autocomplete="off">
      <div class="row"><button class="go" type="submit">搜</button></div>
    </form>
    <div id="searchList" class="empty">未搜。</div>
  </section>
  <section id="pending">
    <div id="pendingList" class="empty">未有待答問題。</div>
  </section>
  <section id="merge">
    <div id="mergeList" class="empty">未有合併建議。</div>
  </section>
</main>
<script>
const tabs = [...document.querySelectorAll("nav button")];
const sections = [...document.querySelectorAll("section")];
function showTab(id) {
  tabs.forEach((b) => b.classList.toggle("on", b.dataset.tab === id));
  sections.forEach((s) => s.classList.toggle("on", s.id === id));
}
tabs.forEach((b) => b.addEventListener("click", () => {
  showTab(b.dataset.tab);
  if (b.dataset.tab === "notes") loadNotes();
  if (b.dataset.tab === "pending") loadPending();
  if (b.dataset.tab === "merge") loadMerge();
}));

let tagFilter = "";

function setTagFilter(tag) {
  tagFilter = tag || "";
  const bar = document.getElementById("noteFilter");
  const lab = document.getElementById("noteFilterLabel");
  if (tagFilter) {
    bar.hidden = false;
    lab.textContent = "篩選：" + tagFilter;
  } else {
    bar.hidden = true;
    lab.textContent = "";
  }
}

function noteCard(n, withDelete) {
  const art = document.createElement("article");
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = (n.createdAt || "") + (n.classifyError ? " · " + n.classifyError : "");
  const tags = document.createElement("div");
  (n.tags || []).forEach((t) => {
    const s = document.createElement("button");
    s.type = "button";
    s.className = "tag" + (tagFilter === t ? " on" : "");
    s.textContent = t;
    s.addEventListener("click", () => {
      setTagFilter(t);
      showTab("notes");
      loadNotes();
    });
    tags.appendChild(s);
  });
  art.appendChild(meta);
  if ((n.tags || []).length) art.appendChild(tags);
  if (n.summary) {
    const sum = document.createElement("div");
    sum.className = "sum";
    sum.textContent = n.summary;
    art.appendChild(sum);
  }
  const pre = document.createElement("pre");
  pre.textContent = n.text || "";
  art.appendChild(pre);
  if (withDelete) {
    const row = document.createElement("div");
    row.className = "row";
    const needRe = !!(n.classifyError || !(n.tags || []).length);
    const err = document.createElement("p");
    err.className = "err";
    err.hidden = true;
    if (needRe) {
      const rec = document.createElement("button");
      rec.type = "button";
      rec.className = "go";
      rec.textContent = "重新分類";
      rec.addEventListener("click", async () => {
        err.hidden = true;
        rec.disabled = true;
        const r = await fetch("/api/notes/" + encodeURIComponent(n.id) + "/reclassify", { method: "POST" });
        const data = await r.json().catch(() => ({}));
        rec.disabled = false;
        if (!r.ok) {
          err.hidden = false;
          err.textContent = data.error || "分類唔到";
          return;
        }
        loadNotes();
      });
      row.appendChild(rec);
    }
    const del = document.createElement("button");
    del.type = "button";
    del.className = "del";
    del.textContent = "刪除";
    del.addEventListener("click", async () => {
      if (!confirm("刪除呢條筆記？")) return;
      err.hidden = true;
      const r = await fetch("/api/notes/" + encodeURIComponent(n.id), { method: "DELETE" });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        err.hidden = false;
        err.textContent = data.error || "刪唔到";
        return;
      }
      loadNotes();
    });
    row.appendChild(del);
    art.appendChild(row);
    art.appendChild(err);
  }
  return art;
}

function qCard(item, canAnswer) {
  const art = document.createElement("article");
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = (item.status || "open") + " · " + (item.createdAt || "");
  const pre = document.createElement("pre");
  pre.textContent = item.text || "";
  art.appendChild(meta);
  art.appendChild(pre);
  if (item.answer) {
    const a = document.createElement("pre");
    a.textContent = "答：" + item.answer;
    art.appendChild(a);
  }
  if (canAnswer && (item.status || "open") === "open") {
    const ta = document.createElement("textarea");
    ta.placeholder = "答呢條";
    ta.style.minHeight = "72px";
    const row = document.createElement("div");
    row.className = "row";
    const btn = document.createElement("button");
    btn.className = "go";
    btn.type = "button";
    btn.textContent = "送出";
    const err = document.createElement("p");
    err.className = "err";
    err.hidden = true;
    btn.addEventListener("click", async () => {
      err.hidden = true;
      const r = await fetch("/api/questions/" + encodeURIComponent(item.id) + "/answer", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ answer: ta.value }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        err.hidden = false;
        err.textContent = data.error || "答唔到";
        return;
      }
      loadPending();
    });
    row.appendChild(btn);
    art.appendChild(ta);
    art.appendChild(row);
    art.appendChild(err);
  }
  return art;
}

async function loadNotes() {
  const el = document.getElementById("notesList");
  const bar = document.getElementById("noteFilter");
  const lab = document.getElementById("noteFilterLabel");
  if (tagFilter) {
    bar.hidden = false;
    lab.textContent = "篩選：" + tagFilter;
  } else {
    bar.hidden = true;
    lab.textContent = "";
  }
  const r = await fetch("/api/notes");
  const data = await r.json();
  let notes = data.notes || [];
  if (tagFilter) notes = notes.filter((n) => (n.tags || []).includes(tagFilter));
  if (!notes.length) {
    el.className = "empty";
    el.textContent = tagFilter ? "呢個 tag 冇筆記。" : "未有筆記。";
    return;
  }
  el.className = "";
  el.replaceChildren(...notes.map((n) => noteCard(n, true)));
}

async function loadPending() {
  const el = document.getElementById("pendingList");
  const r = await fetch("/api/questions");
  const data = await r.json();
  const qs = data.questions || [];
  if (!qs.length) {
    el.className = "empty";
    el.textContent = "未有待答問題。";
    return;
  }
  el.className = "";
  el.replaceChildren(...qs.map((item) => qCard(item, true)));
}

async function loadMerge() {
  const el = document.getElementById("mergeList");
  const r = await fetch("/api/merge-suggestions");
  const data = await r.json();
  const rows = data.suggestions || [];
  if (!rows.length) {
    el.className = "empty";
    el.textContent = "未有合併建議。";
    return;
  }
  el.className = "";
  const notesRes = await fetch("/api/notes");
  const notes = ((await notesRes.json()).notes || []);
  const byId = Object.fromEntries(notes.map((n) => [n.id, n]));
  el.replaceChildren(...rows.map((pair) => {
    const art = document.createElement("article");
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = pair.reason || "重疊";
    art.appendChild(meta);
    [pair.a, pair.b].forEach((id) => {
      const n = byId[id] || { id, text: id };
      const pre = document.createElement("pre");
      pre.textContent = (n.summary || n.text || id).slice(0, 280);
      art.appendChild(pre);
    });
    const row = document.createElement("div");
    row.className = "row";
    const ok = document.createElement("button");
    ok.className = "go";
    ok.type = "button";
    ok.textContent = "合併";
    const no = document.createElement("button");
    no.className = "dim";
    no.type = "button";
    no.textContent = "唔合";
    const err = document.createElement("p");
    err.className = "err";
    err.hidden = true;
    async function act(url) {
      err.hidden = true;
      const res = await fetch(url, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ a: pair.a, b: pair.b }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        err.hidden = false;
        err.textContent = body.error || "做唔到";
        return;
      }
      loadMerge();
    }
    ok.addEventListener("click", () => act("/api/merge-suggestions/accept"));
    no.addEventListener("click", () => act("/api/merge-suggestions/dismiss"));
    row.appendChild(ok);
    row.appendChild(no);
    art.appendChild(row);
    art.appendChild(err);
    return art;
  }));
}

document.getElementById("noteFilterClear").addEventListener("click", () => {
  setTagFilter("");
  loadNotes();
});

document.getElementById("dumpGo").addEventListener("click", async () => {
  const msg = document.getElementById("dumpMsg");
  const text = document.getElementById("dumpText").value;
  msg.hidden = true;
  const r = await fetch("/api/ingest", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ text }),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    msg.hidden = false;
    msg.textContent = data.error || "存唔到";
    return;
  }
  document.getElementById("dumpText").value = "";
  msg.hidden = false;
  if (data.note && data.note.classifyError) msg.textContent = data.note.classifyError;
  else if (data.question) msg.textContent = "已存，有待答問題";
  else msg.textContent = "已分類";
  showTab("notes");
  loadNotes();
});

document.getElementById("searchForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const el = document.getElementById("searchList");
  const q = document.getElementById("q").value;
  const r = await fetch("/api/search?q=" + encodeURIComponent(q));
  const data = await r.json();
  const notes = data.notes || [];
  const questions = data.questions || [];
  if (!notes.length && !questions.length) {
    el.className = "empty";
    el.textContent = "冇結果。";
    return;
  }
  el.className = "";
  const nodes = [];
  notes.forEach((n) => nodes.push(noteCard(n)));
  questions.forEach((item) => nodes.push(qCard(item)));
  el.replaceChildren(...nodes);
});
</script>
</body>
</html>
