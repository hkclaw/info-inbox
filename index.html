<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>info-inbox</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f12;
      --card: #141a1f;
      --line: #243036;
      --text: #e8eef0;
      --muted: #8b9aa0;
      --acc: #5eead4;
      --acc-ink: #042f2e;
      --warn: #fbbf24;
      --danger: #fb7185;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header { padding: 28px 20px 0; max-width: 720px; margin: 0 auto; }
    h1 { font-size: 28px; font-weight: 650; letter-spacing: -0.03em; margin: 0 0 8px; }
    .sub { color: var(--muted); margin: 0 0 18px; font-size: 14.5px; }
    nav {
      display: flex; gap: 4px; flex-wrap: wrap;
      margin: 0 0 22px; padding: 5px;
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    }
    nav button {
      padding: 9px 14px; border: 0; border-radius: 10px; font: inherit;
      cursor: pointer; background: transparent; color: var(--text);
      display: inline-flex; align-items: center; gap: 6px;
    }
    nav button.on { background: var(--acc); color: var(--acc-ink); font-weight: 650; }
    #pendingBadge {
      display: none; min-width: 18px; padding: 0 6px; border-radius: 999px;
      background: var(--acc); color: var(--acc-ink);
      font-size: 12px; font-weight: 700; line-height: 18px; text-align: center;
    }
    #pendingBadge.on { display: inline-block; }
    nav button.on #pendingBadge { background: var(--acc-ink); color: var(--acc); }
    .fold { padding: 4px 10px; font-size: 13px; }
    main { max-width: 720px; margin: 0 auto; padding: 0 20px 96px; }
    section { display: none; }
    section.on { display: block; }
    textarea, input[type=search] {
      width: 100%; padding: 12px 14px; border: 1px solid var(--line);
      border-radius: 12px; background: #0a0e11; color: var(--text); font: inherit;
    }
    textarea { min-height: 160px; resize: vertical; }
    #dump textarea {
      min-height: 280px; padding: 18px; font-size: 17px; line-height: 1.6;
      border-radius: 16px;
    }
    #dump .go { width: 100%; padding: 14px 20px; font-size: 16px; border-radius: 12px; }
    .row { margin-top: 12px; display: flex; gap: 10px; }
    [hidden] { display: none !important; }
    button.go {
      padding: 10px 16px; border: 0; border-radius: 10px;
      background: var(--acc); color: var(--acc-ink);
      font: inherit; font-weight: 650; cursor: pointer;
    }
    button.dim {
      padding: 10px 16px; border: 0; border-radius: 10px;
      background: #1c252b; color: var(--text); font: inherit; cursor: pointer;
    }
    .empty { color: var(--muted); padding: 36px 8px; font-size: 15px; }
    .err { color: var(--warn); margin: 10px 0; }
    article {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 16px; padding: 18px 18px 16px; margin: 0 0 14px;
    }
    article.hl { outline: 2px solid var(--acc); outline-offset: 2px; }
    article .meta { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
    article pre { white-space: pre-wrap; margin: 0; font: inherit; color: #c5d0d4; }
    .tag {
      display: inline-block; margin: 0 8px 6px 0; color: var(--acc);
      font-size: 13px; background: none; border: 0; padding: 0; font: inherit; cursor: pointer;
    }
    .tag.on { text-decoration: underline; }
    button.del {
      padding: 8px 12px; border: 0; border-radius: 10px;
      background: #1c252b; color: var(--danger); font: inherit; cursor: pointer;
    }
    #noteFilter { color: var(--muted); margin: 0 0 12px; }
    .sum { font-weight: 650; margin: 0 0 10px; white-space: pre-wrap; font-size: 17px; }
  </style>
</head>
<body>
<header>
  <h1>info-inbox</h1>
  <p class="sub">本機 inbox。資料只存呢部機。分類用本機 Ollama llama3.2。 <button type="button" class="dim" id="backup">下載備份</button></p>
  <nav>
    <button type="button" data-tab="dump" class="on">Dump</button>
    <button type="button" data-tab="notes">Notes</button>
    <button type="button" data-tab="search">Search</button>
    <button type="button" data-tab="pending">Pending <span id="pendingBadge"></span></button>
    <button type="button" data-tab="merge">Merge</button>
  </nav>
</header>
<main>
  <section id="dump" class="on">
    <textarea id="dumpText" placeholder="貼一大段文字"></textarea>
    <div class="row"><button class="go" type="button" id="dumpGo">存入</button></div>
    <p id="dumpMsg" class="err" hidden></p>
  </section>
  <section id="notes">
    <p id="noteFilter" hidden><span id="noteFilterLabel"></span> <button type="button" class="dim" id="noteFilterClear">清篩選／顯示全部</button></p>
    <div id="notesList" class="empty">未有筆記。去 Dump 貼一段文字。</div>
  </section>
  <section id="search">
    <form id="searchForm">
      <input type="search" id="q" placeholder="關鍵字" autocomplete="off">
      <div class="row"><button class="go" type="submit">搜</button></div>
    </form>
    <div id="searchList" class="empty">未搜。輸入關鍵字搵筆記同問題。</div>
  </section>
  <section id="pending">
    <div id="pendingList" class="empty">未有待答問題。含糊 dump 先會喺度出現。</div>
  </section>
  <section id="merge">
    <div id="mergeList" class="empty">未有合併建議。</div>
  </section>
</main>
<script>
const tabs = [...document.querySelectorAll("nav button")];
const sections = [...document.querySelectorAll("section")];
function showTab(id) {
  tabs.forEach((b) => b.classList.toggle("on", b.dataset.tab === id));
  sections.forEach((s) => s.classList.toggle("on", s.id === id));
}
tabs.forEach((b) => b.addEventListener("click", () => {
  showTab(b.dataset.tab);
  if (b.dataset.tab === "notes") loadNotes();
  if (b.dataset.tab === "pending") loadPending();
  if (b.dataset.tab === "merge") loadMerge();
}));

let tagFilter = "";

function setTagFilter(tag) {
  tagFilter = tag || "";
  const bar = document.getElementById("noteFilter");
  const lab = document.getElementById("noteFilterLabel");
  if (tagFilter) {
    bar.hidden = false;
    lab.textContent = "篩選：" + tagFilter;
  } else {
    bar.hidden = true;
    lab.textContent = "";
  }
}

let highlightId = "";

function noteCard(n, withDelete) {
  const art = document.createElement("article");
  art.dataset.noteId = n.id;
  if (highlightId && n.id === highlightId) art.classList.add("hl");
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = (n.createdAt || "") + (n.classifyError ? " · " + n.classifyError : "");
  const tags = document.createElement("div");
  (n.tags || []).forEach((t) => {
    const s = document.createElement("button");
    s.type = "button";
    s.className = "tag" + (tagFilter === t ? " on" : "");
    s.textContent = t;
    s.addEventListener("click", () => {
      setTagFilter(t);
      showTab("notes");
      loadNotes();
    });
    tags.appendChild(s);
  });
  art.appendChild(meta);
  if (n.summary) {
    const sum = document.createElement("div");
    sum.className = "sum";
    sum.textContent = n.summary;
    art.appendChild(sum);
  }
  if ((n.tags || []).length) art.appendChild(tags);
  const pre = document.createElement("pre");
  pre.textContent = n.text || "";
  const fold = document.createElement("button");
  fold.type = "button";
  fold.className = "dim fold";
  const openBody = !!(highlightId && n.id === highlightId);
  pre.hidden = !openBody;
  fold.textContent = openBody ? "收起正文" : "睇正文";
  fold.addEventListener("click", () => {
    pre.hidden = !pre.hidden;
    fold.textContent = pre.hidden ? "睇正文" : "收起正文";
  });
  art.appendChild(fold);
  art.appendChild(pre);
  if (withDelete) {
    const row = document.createElement("div");
    row.className = "row";
    const needRe = !!(n.classifyError || !(n.tags || []).length);
    const err = document.createElement("p");
    err.className = "err";
    err.hidden = true;
    if (needRe) {
      const rec = document.createElement("button");
      rec.type = "button";
      rec.className = "go";
      rec.textContent = "重新分類";
      rec.addEventListener("click", async () => {
        err.hidden = true;
        rec.disabled = true;
        const r = await fetch("/api/notes/" + encodeURIComponent(n.id) + "/reclassify", { method: "POST" });
        const data = await r.json().catch(() => ({}));
        rec.disabled = false;
        if (!r.ok) {
          err.hidden = false;
          err.textContent = data.error || "分類唔到";
          return;
        }
        loadNotes();
      });
      row.appendChild(rec);
    }
    const edit = document.createElement("button");
    edit.type = "button";
    edit.className = "dim";
    edit.textContent = "編輯";
    const ta = document.createElement("textarea");
    ta.style.minHeight = "120px";
    ta.hidden = true;
    const saveRow = document.createElement("div");
    saveRow.className = "row";
    saveRow.hidden = true;
    const saveBtn = document.createElement("button");
    saveBtn.type = "button";
    saveBtn.className = "go";
    saveBtn.textContent = "儲存";
    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.className = "dim";
    cancelBtn.textContent = "取消";
    saveRow.appendChild(saveBtn);
    saveRow.appendChild(cancelBtn);
    function stopEdit() {
      ta.hidden = true;
      saveRow.hidden = true;
      pre.hidden = false;
      edit.hidden = false;
    }
    edit.addEventListener("click", () => {
      err.hidden = true;
      ta.value = n.text || "";
      pre.hidden = true;
      ta.hidden = false;
      saveRow.hidden = false;
      edit.hidden = true;
    });
    cancelBtn.addEventListener("click", () => stopEdit());
    saveBtn.addEventListener("click", async () => {
      err.hidden = true;
      const r = await fetch("/api/notes/" + encodeURIComponent(n.id), {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ text: ta.value }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        err.hidden = false;
        err.textContent = data.error || "存唔到";
        return;
      }
      loadNotes();
    });
    art.appendChild(ta);
    art.appendChild(saveRow);
    row.appendChild(edit);
    const del = document.createElement("button");
    del.type = "button";
    del.className = "del";
    del.textContent = "刪除";
    del.addEventListener("click", async () => {
      if (!confirm("刪除呢條筆記？")) return;
      err.hidden = true;
      const r = await fetch("/api/notes/" + encodeURIComponent(n.id), { method: "DELETE" });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        err.hidden = false;
        err.textContent = data.error || "刪唔到";
        return;
      }
      loadNotes();
    });
    row.appendChild(del);
    art.appendChild(row);
    art.appendChild(err);
  }
  return art;
}

function qCard(item, canAnswer) {
  const art = document.createElement("article");
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = (item.status || "open") + " · " + (item.createdAt || "");
  const pre = document.createElement("pre");
  pre.textContent = item.text || "";
  art.appendChild(meta);
  art.appendChild(pre);
  if (item.noteId) {
    const srcBtn = document.createElement("button");
    srcBtn.type = "button";
    srcBtn.className = "dim";
    srcBtn.textContent = "睇來源筆記";
    srcBtn.addEventListener("click", () => showSourceNote(item.noteId));
    const srcRow = document.createElement("div");
    srcRow.className = "row";
    srcRow.appendChild(srcBtn);
    art.appendChild(srcRow);
  }
  if (item.answer) {
    const a = document.createElement("pre");
    a.textContent = "答：" + item.answer;
    art.appendChild(a);
  }
  if (canAnswer && (item.status || "open") === "open") {
    const ta = document.createElement("textarea");
    ta.placeholder = "答呢條";
    ta.style.minHeight = "72px";
    const row = document.createElement("div");
    row.className = "row";
    const btn = document.createElement("button");
    btn.className = "go";
    btn.type = "button";
    btn.textContent = "送出";
    const err = document.createElement("p");
    err.className = "err";
    err.hidden = true;
    btn.addEventListener("click", async () => {
      err.hidden = true;
      const r = await fetch("/api/questions/" + encodeURIComponent(item.id) + "/answer", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ answer: ta.value }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        err.hidden = false;
        err.textContent = data.error || "答唔到";
        return;
      }
      await loadPending();
      if (data.note && data.note.id) await showSourceNote(data.note.id);
    });
    row.appendChild(btn);
    art.appendChild(ta);
    art.appendChild(row);
    art.appendChild(err);
  }
  return art;
}

async function loadNotes() {
  const el = document.getElementById("notesList");
  const bar = document.getElementById("noteFilter");
  const lab = document.getElementById("noteFilterLabel");
  if (tagFilter) {
    bar.hidden = false;
    lab.textContent = "篩選：" + tagFilter;
  } else {
    bar.hidden = true;
    lab.textContent = "";
  }
  const r = await fetch("/api/notes");
  const data = await r.json();
  let notes = data.notes || [];
  if (tagFilter) notes = notes.filter((n) => (n.tags || []).includes(tagFilter));
  if (!notes.length) {
    el.className = "empty";
    el.textContent = tagFilter ? "呢個 tag 冇筆記。" : "未有筆記。去 Dump 貼一段文字。";
    return;
  }
  el.className = "";
  el.replaceChildren(...notes.map((n) => noteCard(n, true)));
  if (highlightId) {
    const hit = el.querySelector('[data-note-id="' + CSS.escape(highlightId) + '"]');
    if (hit) hit.scrollIntoView({ block: "center" });
  }
}

async function showSourceNote(id) {
  highlightId = id;
  setTagFilter("");
  showTab("notes");
  await loadNotes();
  const hit = document.querySelector('#notesList [data-note-id="' + CSS.escape(id) + '"]');
  if (hit) {
    hit.classList.add("hl");
    hit.scrollIntoView({ block: "center" });
  }
}

async function refreshPendingBadge() {
  const r = await fetch("/api/questions");
  const data = await r.json().catch(() => ({}));
  const n = (data.questions || []).filter((q) => (q.status || "open") === "open").length;
  const b = document.getElementById("pendingBadge");
  b.textContent = n ? String(n) : "";
  b.classList.toggle("on", n > 0);
}

async function loadPending() {
  await refreshPendingBadge();
  const el = document.getElementById("pendingList");
  const r = await fetch("/api/questions");
  const data = await r.json();
  const qs = data.questions || [];
  if (!qs.length) {
    el.className = "empty";
    el.textContent = "未有待答問題。含糊 dump 先會喺度出現。";
    return;
  }
  el.className = "";
  el.replaceChildren(...qs.map((item) => qCard(item, true)));
}

async function loadMerge() {
  const el = document.getElementById("mergeList");
  const r = await fetch("/api/merge-suggestions");
  const data = await r.json();
  const rows = data.suggestions || [];
  if (!rows.length) {
    el.className = "empty";
    el.textContent = "未有合併建議。";
    return;
  }
  el.className = "";
  const notesRes = await fetch("/api/notes");
  const notes = ((await notesRes.json()).notes || []);
  const byId = Object.fromEntries(notes.map((n) => [n.id, n]));
  el.replaceChildren(...rows.map((pair) => {
    const art = document.createElement("article");
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = pair.reason || "重疊";
    art.appendChild(meta);
    [pair.a, pair.b].forEach((id) => {
      const n = byId[id] || { id, text: id };
      const pre = document.createElement("pre");
      pre.textContent = (n.summary || n.text || id).slice(0, 280);
      art.appendChild(pre);
    });
    const row = document.createElement("div");
    row.className = "row";
    const ok = document.createElement("button");
    ok.className = "go";
    ok.type = "button";
    ok.textContent = "合併";
    const no = document.createElement("button");
    no.className = "dim";
    no.type = "button";
    no.textContent = "唔合";
    const err = document.createElement("p");
    err.className = "err";
    err.hidden = true;
    async function act(url) {
      err.hidden = true;
      const res = await fetch(url, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ a: pair.a, b: pair.b }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        err.hidden = false;
        err.textContent = body.error || "做唔到";
        return;
      }
      loadMerge();
    }
    ok.addEventListener("click", () => act("/api/merge-suggestions/accept"));
    no.addEventListener("click", () => act("/api/merge-suggestions/dismiss"));
    row.appendChild(ok);
    row.appendChild(no);
    art.appendChild(row);
    art.appendChild(err);
    return art;
  }));
}

document.getElementById("noteFilterClear").addEventListener("click", () => {
  setTagFilter("");
  loadNotes();
});

document.getElementById("dumpGo").addEventListener("click", async () => {
  const msg = document.getElementById("dumpMsg");
  const text = document.getElementById("dumpText").value;
  msg.hidden = true;
  const r = await fetch("/api/ingest", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ text }),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    msg.hidden = false;
    msg.textContent = data.error || "存唔到";
    return;
  }
  document.getElementById("dumpText").value = "";
  msg.hidden = false;
  if (data.note && data.note.classifyError) msg.textContent = data.note.classifyError;
  else if (data.question) msg.textContent = "已存，有待答問題";
  else msg.textContent = "已分類";
  showTab("notes");
  loadNotes();
  refreshPendingBadge();
});

document.getElementById("searchForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const el = document.getElementById("searchList");
  const q = document.getElementById("q").value;
  const r = await fetch("/api/search?q=" + encodeURIComponent(q));
  const data = await r.json();
  const notes = data.notes || [];
  const questions = data.questions || [];
  if (!notes.length && !questions.length) {
    el.className = "empty";
    el.textContent = "冇結果。";
    return;
  }
  el.className = "";
  const nodes = [];
  notes.forEach((n) => nodes.push(noteCard(n)));
  questions.forEach((item) => nodes.push(qCard(item)));
  el.replaceChildren(...nodes);
});

document.getElementById("backup").addEventListener("click", async () => {
  const r = await fetch("/api/export");
  if (!r.ok) return;
  const blob = await r.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "info-inbox-backup.json";
  a.click();
  URL.revokeObjectURL(a.href);
});

refreshPendingBadge();
</script>
</body>
</html>
