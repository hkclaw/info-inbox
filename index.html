<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>info-inbox</title>
  <style>
    :root {
      color-scheme: dark;
      --canvas: #1A1714;
      --surface: #221E1A;
      --elevated: #2B2620;
      --hairline: #3A332B;
      --text-1: #ECE3D2;
      --text-2: #B8AB94;
      --text-3: #8A7E6A;
      --acc: #c98f63;
      --acc-hover: #d9a679;
      --acc-pressed: #b87f55;
      --acc-ink: #1A1714;
      --acc-soft: rgba(201, 143, 99, 0.14);
      --danger: #C97A6A;
      --paper: #F4ECD8;
      --paper-ink: #2A241C;
      --tag-bg: #332C24;
      --tag-ink: #D9CFB8;
      --sidebar-w: 240px;
      --measure: 760px;
      --header-h: 56px;
      --ease: 150ms ease;
      --font: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui,
        -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font: 14px/1.6 var(--font);
      background: var(--canvas);
      color: var(--text-1);
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font: inherit; color: inherit; }
    [hidden] { display: none !important; }

    .app {
      display: flex;
      min-height: 100%;
      background: var(--canvas);
    }

    /* ——— Left text nav ——— */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--hairline);
      display: flex;
      flex-direction: column;
      padding: 0 0 16px;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .brand {
      height: var(--header-h);
      display: flex;
      align-items: center;
      padding: 0 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-1);
      border-bottom: 1px solid var(--hairline);
    }
    .brand span {
      color: var(--text-3);
      font-weight: 500;
      margin-left: 6px;
    }
    .sidebar nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      padding: 16px 10px;
    }
    .sidebar nav button {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-2);
      font-size: 14px;
      cursor: pointer;
      transition: background var(--ease), color var(--ease), opacity var(--ease);
    }
    .sidebar nav button:hover {
      background: var(--elevated);
      color: var(--text-1);
    }
    .sidebar nav button.on {
      background: transparent;
      color: var(--text-1);
      font-weight: 600;
    }
    .sidebar nav button.on::before {
      content: "";
      position: absolute;
      left: 0;
      top: 8px;
      bottom: 8px;
      width: 4px;
      border-radius: 2px;
      background: var(--acc);
    }
    #pendingBadge {
      display: none;
      margin-left: auto;
      min-width: 18px;
      padding: 0 6px;
      border-radius: 999px;
      background: transparent;
      border: 1px solid var(--hairline);
      color: var(--text-3);
      font-size: 11px;
      font-weight: 600;
      line-height: 17px;
      text-align: center;
    }
    #pendingBadge.on { display: inline-block; }
    .sidebar-foot {
      padding: 12px 20px 4px;
      border-top: 1px solid var(--hairline);
    }
    .sidebar-foot .hint {
      margin: 0;
      font-size: 11.5px;
      line-height: 1.45;
      color: var(--text-3);
    }

    /* ——— Main column ——— */
    .workspace {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--canvas);
    }
    .page-head {
      height: var(--header-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      max-width: var(--measure);
      width: 100%;
      margin: 0 auto;
      padding: 0 24px;
      border-bottom: 1px solid var(--hairline);
    }
    .page-head h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-1);
    }
    .page-head .lede { display: none; }
    .backup {
      padding: 6px 12px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: transparent;
      color: var(--text-2);
      font-size: 12.5px;
      cursor: pointer;
      transition: background var(--ease), color var(--ease), opacity var(--ease);
    }
    .backup:hover {
      background: var(--elevated);
      color: var(--text-1);
    }
    .canvas {
      max-width: var(--measure);
      width: 100%;
      margin: 0 auto;
      padding: 24px 24px 96px;
      flex: 1;
    }
    section { display: none; animation: fade 150ms ease; }
    section.on { display: block; }
    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ——— Dump: one paper page ——— */
    #dump .paper {
      display: flex;
      flex-direction: column;
      background: var(--paper);
      color: var(--paper-ink);
      border: 0;
      border-radius: 12px;
      padding: 24px;
      min-height: 60vh;
      position: relative;
    }
    #dump .paper.drag {
      outline: 2px dashed color-mix(in srgb, var(--acc) 70%, var(--paper-ink));
      outline-offset: -6px;
    }
    #dump textarea {
      width: 100%;
      flex: 1;
      min-height: calc(60vh - 88px);
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--paper-ink);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.7;
      resize: vertical;
      outline: none;
    }
    #dump textarea::placeholder { color: color-mix(in srgb, var(--paper-ink) 40%, transparent); }
    #dump .paper-foot {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    #dump .paper-foot .file-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    #dump .paper-foot .model-pick {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: color-mix(in srgb, var(--paper-ink) 72%, transparent);
    }
    #dump .paper-foot .model-pick select {
      max-width: 220px;
      padding: 5px 8px;
      border: 1px solid color-mix(in srgb, var(--paper-ink) 18%, transparent);
      border-radius: 6px;
      background: transparent;
      color: var(--paper-ink);
      font: inherit;
      font-size: 13px;
    }
    #dump .paper-foot .model-pick select:disabled {
      opacity: 0.55;
    }
    #dump .paper-foot .dim {
      color: color-mix(in srgb, var(--paper-ink) 72%, transparent);
    }
    #dump .paper-foot .dim:hover {
      background: color-mix(in srgb, var(--paper-ink) 8%, transparent);
      color: var(--paper-ink);
    }
    #dump .go { min-width: 88px; }
    #dumpFile { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
    #dump .staged {
      list-style: none;
      margin: 12px 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #dump .staged li {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 12.5px;
      line-height: 1.45;
      color: color-mix(in srgb, var(--paper-ink) 78%, transparent);
    }
    #dump .staged .staged-meta {
      flex: 1;
      min-width: 0;
      word-break: break-all;
    }
    #dump .staged .staged-meta strong {
      font-weight: 600;
      color: var(--paper-ink);
    }
    #dump .staged .staged-meta span {
      opacity: 0.85;
    }

    /* ——— Forms & controls ——— */
    textarea, input[type=search] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--hairline);
      border-radius: 10px;
      background: var(--elevated);
      color: var(--text-1);
      outline: none;
      transition: background var(--ease), opacity var(--ease);
    }
    textarea:focus, input[type=search]:focus {
      border-color: color-mix(in srgb, var(--acc) 55%, var(--hairline));
    }
    textarea { min-height: 100px; resize: vertical; }
    .row { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button.go {
      padding: 8px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--acc);
      color: var(--acc-ink);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--ease), opacity var(--ease);
    }
    button.go:hover { background: var(--acc-hover); }
    button.go:active { background: var(--acc-pressed); }
    button.go:disabled { opacity: 0.55; cursor: default; }
    button.dim, button.del {
      padding: 6px 10px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text-2);
      font-size: 13px;
      cursor: pointer;
      transition: background var(--ease), color var(--ease), opacity var(--ease);
    }
    button.dim:hover {
      background: var(--elevated);
      color: var(--text-1);
    }
    button.del { color: var(--danger); }
    button.del:hover {
      background: rgba(201, 122, 106, 0.12);
      color: var(--danger);
    }
    button.fold {
      padding: 2px 0;
      font-size: 12px;
      color: var(--text-3);
      background: none;
      border: 0;
      cursor: pointer;
      transition: color var(--ease), opacity var(--ease);
    }
    button.fold:hover { color: var(--acc); }

    .empty {
      color: var(--text-2);
      padding: 48px 4px;
      font-size: 14px;
      line-height: 1.6;
    }
    .err {
      color: var(--acc);
      margin: 12px 0 0;
      font-size: 13px;
    }
    #dumpMsg.ok { color: var(--text-2); }
    #noteFilter {
      color: var(--text-2);
      margin: 0 0 12px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* ——— Cards ——— */
    article {
      background: var(--elevated);
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 20px 24px;
      margin: 0 0 12px;
      transition: background var(--ease), opacity var(--ease);
    }
    article:hover { background: color-mix(in srgb, var(--elevated) 85%, var(--acc) 8%); }
    article.hl {
      background: var(--acc-soft);
      border-color: color-mix(in srgb, var(--acc) 40%, var(--hairline));
    }
    article .meta {
      color: var(--text-3);
      font-size: 12px;
      margin-bottom: 8px;
    }
    article pre {
      white-space: pre-wrap;
      margin: 10px 0 0;
      font: inherit;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-2);
    }
    .sum {
      font-weight: 600;
      margin: 0 0 10px;
      white-space: pre-wrap;
      font-size: 16px;
      line-height: 1.45;
      color: var(--text-1);
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }
    .tag {
      display: inline-block;
      margin: 0 6px 6px 0;
      padding: 2px 8px;
      border-radius: 999px;
      border: 0;
      background: var(--tag-bg);
      color: var(--tag-ink);
      font-size: 12px;
      cursor: pointer;
      transition: background var(--ease), opacity var(--ease), color var(--ease);
    }
    .tag:hover { opacity: 0.9; color: var(--text-1); }
    .tag.on {
      background: var(--acc-soft);
      color: var(--acc);
    }
    article .row { margin-top: 12px; }
    #searchForm { margin-bottom: 8px; }
    #searchForm .row { margin-top: 14px; }
    #searchForm input[type=search] {
      font-size: 15px;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--surface);
    }

    @media (max-width: 720px) {
      .app { flex-direction: column; }
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        border-right: 0;
        border-bottom: 1px solid var(--hairline);
      }
      .sidebar nav {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 4px;
        padding: 10px;
      }
      .sidebar nav button { width: auto; padding: 8px 12px; }
      .sidebar nav button.on::before { display: none; }
      .sidebar nav button.on { background: var(--elevated); }
      .sidebar-foot { display: none; }
      .page-head, .canvas { padding-left: 16px; padding-right: 16px; }
      #dump .paper { min-height: 50vh; padding: 18px; }
      #dump textarea { min-height: calc(50vh - 80px); }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">info-inbox<span>本機</span></div>
    <nav>
      <button type="button" data-tab="dump" class="on">傾倒</button>
      <button type="button" data-tab="notes">筆記</button>
      <button type="button" data-tab="search">搜尋</button>
      <button type="button" data-tab="pending">待答 <span id="pendingBadge"></span></button>
      <button type="button" data-tab="merge">合併</button>
    </nav>
    <div class="sidebar-foot">
      <p class="hint">本機 inbox。資料只存呢部機。分類用本機 Ollama。</p>
    </div>
  </aside>
  <div class="workspace">
    <header class="page-head">
      <h1 id="pageTitle">傾倒</h1>
      <p class="lede" id="pageLede">貼文字或拖檔。分類稍後做。</p>
      <button type="button" class="backup" id="backup">下載備份</button>
    </header>
    <main class="canvas">
      <section id="dump" class="on">
        <div class="paper" id="dumpPaper">
          <input type="file" id="dumpFile" multiple>
          <textarea id="dumpText" placeholder="貼一大段文字，或拖檔入嚟"></textarea>
          <ul id="dumpStaged" class="staged" hidden></ul>
          <div class="paper-foot">
            <div class="file-actions">
              <button class="dim" type="button" id="dumpPick">揀檔</button>
              <label class="model-pick">模型
                <select id="ollamaModel" disabled aria-label="Ollama model"></select>
              </label>
            </div>
            <button class="go" type="button" id="dumpGo">存入</button>
          </div>
        </div>
        <p id="dumpMsg" class="err" hidden></p>
        <p id="dumpDup" class="err" hidden>呢段同已有 note 一樣。 <button type="button" class="dim" id="dumpConfirm">仍然存入</button></p>
      </section>
      <section id="notes">
        <p id="noteFilter" hidden><span id="noteFilterLabel"></span> <button type="button" class="dim" id="noteFilterClear">清篩選／顯示全部</button></p>
        <div id="notesList" class="empty">未有筆記。去 Dump 貼一段文字。</div>
      </section>
      <section id="search">
        <form id="searchForm">
          <input type="search" id="q" placeholder="關鍵字" autocomplete="off">
          <div class="row"><button class="go" type="submit">搜</button></div>
        </form>
        <div id="searchList" class="empty">未搜。輸入關鍵字搵筆記同問題。</div>
      </section>
      <section id="pending">
        <div id="pendingList" class="empty">未有待答問題。含糊 dump 先會喺度出現。</div>
      </section>
      <section id="merge">
        <div id="mergeList" class="empty">未有合併建議。</div>
      </section>
    </main>
  </div>
</div>
<script>
const tabs = [...document.querySelectorAll(".sidebar nav button")];
const sections = [...document.querySelectorAll("section")];
const pageCopy = {
  dump: { title: "傾倒", lede: "貼文字或拖檔。分類稍後做。" },
  notes: { title: "筆記", lede: "本機筆記。點 tag 篩選。" },
  search: { title: "搜尋", lede: "搵筆記同問題。" },
  pending: { title: "待答", lede: "含糊 dump 留下嘅待答問題。" },
  merge: { title: "合併", lede: "重疊筆記建議。接受或唔合。" },
};

async function loadOllamaModels() {
  const sel = document.getElementById("ollamaModel");
  if (!sel) return;
  sel.innerHTML = "";
  sel.disabled = true;
  let data = { ok: false, models: [], selected: null };
  try {
    const r = await fetch("/api/models");
    data = await r.json().catch(() => data);
  } catch {
    /* Ollama / server unreachable — leave empty */
  }
  const models = Array.isArray(data.models) ? data.models.filter(Boolean) : [];
  if (!data.ok || !models.length) {
    sel.innerHTML = "";
    sel.disabled = true;
    return;
  }
  for (const name of models) {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name;
    sel.appendChild(opt);
  }
  const selected = data.selected && models.includes(data.selected) ? data.selected : models[0];
  sel.value = selected;
  sel.disabled = false;
}

document.getElementById("ollamaModel").addEventListener("change", async () => {
  const sel = document.getElementById("ollamaModel");
  const model = sel.value;
  if (!model) return;
  try {
    const r = await fetch("/api/model", {
      method: "PUT",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ model }),
    });
    if (!r.ok) await loadOllamaModels();
  } catch {
    await loadOllamaModels();
  }
});
function showTab(id) {
  tabs.forEach((b) => b.classList.toggle("on", b.dataset.tab === id));
  sections.forEach((s) => s.classList.toggle("on", s.id === id));
  const copy = pageCopy[id] || pageCopy.dump;
  document.getElementById("pageTitle").textContent = copy.title;
  document.getElementById("pageLede").textContent = copy.lede;
}
tabs.forEach((b) => b.addEventListener("click", () => {
  showTab(b.dataset.tab);
  if (b.dataset.tab === "notes") loadNotes();
  if (b.dataset.tab === "pending") loadPending();
  if (b.dataset.tab === "merge") loadMerge();
}));

let tagFilter = "";

function setTagFilter(tag) {
  tagFilter = tag || "";
  const bar = document.getElementById("noteFilter");
  const lab = document.getElementById("noteFilterLabel");
  if (tagFilter) {
    bar.hidden = false;
    lab.textContent = "篩選：" + tagFilter;
  } else {
    bar.hidden = true;
    lab.textContent = "";
  }
}

let highlightId = "";

function formatHkDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return String(iso);
  const s = d.toLocaleString("sv-SE", { timeZone: "Asia/Hong_Kong", hour12: false });
  return s.slice(0, 16);
}

function formatBytes(n) {
  const b = Number(n) || 0;
  if (b < 1024) return b + " B";
  if (b < 1024 * 1024) return (b / 1024).toFixed(1).replace(/\.0$/, "") + " KB";
  return (b / (1024 * 1024)).toFixed(1).replace(/\.0$/, "") + " MB";
}

function noteCard(n, withDelete) {
  const art = document.createElement("article");
  art.dataset.noteId = n.id;
  if (highlightId && n.id === highlightId) art.classList.add("hl");
  const meta = document.createElement("div");
  meta.className = "meta";
  const metaBits = [];
  if (n.filename) {
    metaBits.push(n.filename);
    if (n.bytes != null && n.bytes !== "") metaBits.push(formatBytes(n.bytes));
    const dateShow = n.fileModifiedAt || n.ingestedAt || n.createdAt || "";
    if (dateShow) metaBits.push(formatHkDate(dateShow));
  } else {
    const dateShow = n.ingestedAt || n.createdAt || "";
    if (dateShow) metaBits.push(formatHkDate(dateShow));
  }
  meta.textContent = metaBits.join(" · ");
  const tags = document.createElement("div");
  (n.tags || []).forEach((t) => {
    const s = document.createElement("button");
    s.type = "button";
    s.className = "tag" + (tagFilter === t ? " on" : "");
    s.textContent = t;
    s.addEventListener("click", () => {
      setTagFilter(t);
      showTab("notes");
      loadNotes();
    });
    tags.appendChild(s);
  });
  art.appendChild(meta);
  if (n.classifyError) {
    const errLine = document.createElement("div");
    errLine.className = "err";
    errLine.style.margin = "4px 0 0";
    errLine.textContent = n.classifyError;
    art.appendChild(errLine);
  }
  if (n.summary) {
    const sum = document.createElement("div");
    sum.className = "sum";
    sum.textContent = n.summary;
    art.appendChild(sum);
  }
  if ((n.tags || []).length) art.appendChild(tags);
  const pre = document.createElement("pre");
  pre.textContent = n.text || "";
  const fold = document.createElement("button");
  fold.type = "button";
  fold.className = "fold";
  const openBody = !!(highlightId && n.id === highlightId);
  pre.hidden = !openBody;
  fold.textContent = openBody ? "收起正文" : "睇正文";
  fold.addEventListener("click", () => {
    pre.hidden = !pre.hidden;
    fold.textContent = pre.hidden ? "睇正文" : "收起正文";
  });
  art.appendChild(fold);
  art.appendChild(pre);
  if (withDelete) {
    const row = document.createElement("div");
    row.className = "row";
    const needRe = !!(n.classifyError || !(n.tags || []).length);
    const err = document.createElement("p");
    err.className = "err";
    err.hidden = true;
    if (needRe) {
      const rec = document.createElement("button");
      rec.type = "button";
      rec.className = "go";
      rec.textContent = "重新分類";
      rec.addEventListener("click", async () => {
        err.hidden = true;
        rec.disabled = true;
        const r = await fetch("/api/notes/" + encodeURIComponent(n.id) + "/reclassify", { method: "POST" });
        const data = await r.json().catch(() => ({}));
        rec.disabled = false;
        if (!r.ok) {
          err.hidden = false;
          err.textContent = data.error || "分類唔到";
          return;
        }
        loadNotes();
      });
      row.appendChild(rec);
    }
    const edit = document.createElement("button");
    edit.type = "button";
    edit.className = "dim";
    edit.textContent = "編輯";
    const ta = document.createElement("textarea");
    ta.style.minHeight = "120px";
    ta.hidden = true;
    const saveRow = document.createElement("div");
    saveRow.className = "row";
    saveRow.hidden = true;
    const saveBtn = document.createElement("button");
    saveBtn.type = "button";
    saveBtn.className = "go";
    saveBtn.textContent = "儲存";
    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.className = "dim";
    cancelBtn.textContent = "取消";
    saveRow.appendChild(saveBtn);
    saveRow.appendChild(cancelBtn);
    function stopEdit() {
      ta.hidden = true;
      saveRow.hidden = true;
      pre.hidden = false;
      edit.hidden = false;
    }
    edit.addEventListener("click", () => {
      err.hidden = true;
      ta.value = n.text || "";
      pre.hidden = true;
      ta.hidden = false;
      saveRow.hidden = false;
      edit.hidden = true;
    });
    cancelBtn.addEventListener("click", () => stopEdit());
    saveBtn.addEventListener("click", async () => {
      err.hidden = true;
      const r = await fetch("/api/notes/" + encodeURIComponent(n.id), {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ text: ta.value }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        err.hidden = false;
        err.textContent = data.error || "存唔到";
        return;
      }
      loadNotes();
    });
    art.appendChild(ta);
    art.appendChild(saveRow);
    row.appendChild(edit);
    const del = document.createElement("button");
    del.type = "button";
    del.className = "del";
    del.textContent = "刪除";
    del.addEventListener("click", async () => {
      if (!confirm("刪除呢條筆記？")) return;
      err.hidden = true;
      const r = await fetch("/api/notes/" + encodeURIComponent(n.id), { method: "DELETE" });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        err.hidden = false;
        err.textContent = data.error || "刪唔到";
        return;
      }
      loadNotes();
    });
    row.appendChild(del);
    art.appendChild(row);
    art.appendChild(err);
  }
  return art;
}

function qCard(item, canAnswer) {
  const art = document.createElement("article");
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = (item.status || "open") + " · " + (item.createdAt || "");
  const pre = document.createElement("pre");
  pre.textContent = item.text || "";
  art.appendChild(meta);
  art.appendChild(pre);
  if (item.noteId) {
    const srcBtn = document.createElement("button");
    srcBtn.type = "button";
    srcBtn.className = "dim";
    srcBtn.textContent = "睇來源筆記";
    srcBtn.addEventListener("click", () => showSourceNote(item.noteId));
    const srcRow = document.createElement("div");
    srcRow.className = "row";
    srcRow.appendChild(srcBtn);
    art.appendChild(srcRow);
  }
  if (item.answer) {
    const a = document.createElement("pre");
    a.textContent = "答：" + item.answer;
    art.appendChild(a);
  }
  if (canAnswer && (item.status || "open") === "open") {
    const ta = document.createElement("textarea");
    ta.placeholder = "答呢條";
    ta.style.minHeight = "72px";
    const row = document.createElement("div");
    row.className = "row";
    const btn = document.createElement("button");
    btn.className = "go";
    btn.type = "button";
    btn.textContent = "送出";
    const err = document.createElement("p");
    err.className = "err";
    err.hidden = true;
    btn.addEventListener("click", async () => {
      err.hidden = true;
      const r = await fetch("/api/questions/" + encodeURIComponent(item.id) + "/answer", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ answer: ta.value }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        err.hidden = false;
        err.textContent = data.error || "答唔到";
        return;
      }
      await loadPending();
      if (data.note && data.note.id) await showSourceNote(data.note.id);
    });
    row.appendChild(btn);
    art.appendChild(ta);
    art.appendChild(row);
    art.appendChild(err);
  }
  return art;
}

async function loadNotes() {
  const el = document.getElementById("notesList");
  const bar = document.getElementById("noteFilter");
  const lab = document.getElementById("noteFilterLabel");
  if (tagFilter) {
    bar.hidden = false;
    lab.textContent = "篩選：" + tagFilter;
  } else {
    bar.hidden = true;
    lab.textContent = "";
  }
  const r = await fetch("/api/notes");
  const data = await r.json();
  let notes = data.notes || [];
  if (tagFilter) notes = notes.filter((n) => (n.tags || []).includes(tagFilter));
  if (!notes.length) {
    el.className = "empty";
    el.textContent = tagFilter ? "呢個 tag 冇筆記。" : "未有筆記。去 Dump 貼一段文字。";
    return;
  }
  el.className = "";
  el.replaceChildren(...notes.map((n) => noteCard(n, true)));
  if (highlightId) {
    const hit = el.querySelector('[data-note-id="' + CSS.escape(highlightId) + '"]');
    if (hit) hit.scrollIntoView({ block: "center" });
  }
}

async function showSourceNote(id) {
  highlightId = id;
  setTagFilter("");
  showTab("notes");
  await loadNotes();
  const hit = document.querySelector('#notesList [data-note-id="' + CSS.escape(id) + '"]');
  if (hit) {
    hit.classList.add("hl");
    hit.scrollIntoView({ block: "center" });
  }
}

async function refreshPendingBadge() {
  const r = await fetch("/api/questions");
  const data = await r.json().catch(() => ({}));
  const n = (data.questions || []).filter((q) => (q.status || "open") === "open").length;
  const b = document.getElementById("pendingBadge");
  b.textContent = n ? String(n) : "";
  b.classList.toggle("on", n > 0);
}

async function loadPending() {
  await refreshPendingBadge();
  const el = document.getElementById("pendingList");
  const r = await fetch("/api/questions");
  const data = await r.json();
  const qs = data.questions || [];
  if (!qs.length) {
    el.className = "empty";
    el.textContent = "未有待答問題。含糊 dump 先會喺度出現。";
    return;
  }
  el.className = "";
  el.replaceChildren(...qs.map((item) => qCard(item, true)));
}

async function loadMerge() {
  const el = document.getElementById("mergeList");
  const r = await fetch("/api/merge-suggestions");
  const data = await r.json();
  const rows = data.suggestions || [];
  if (!rows.length) {
    el.className = "empty";
    el.textContent = "未有合併建議。";
    return;
  }
  el.className = "";
  const notesRes = await fetch("/api/notes");
  const notes = ((await notesRes.json()).notes || []);
  const byId = Object.fromEntries(notes.map((n) => [n.id, n]));
  el.replaceChildren(...rows.map((pair) => {
    const art = document.createElement("article");
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = pair.reason || "重疊";
    art.appendChild(meta);
    [pair.a, pair.b].forEach((id) => {
      const n = byId[id] || { id, text: id };
      const pre = document.createElement("pre");
      pre.textContent = (n.summary || n.text || id).slice(0, 280);
      art.appendChild(pre);
    });
    const row = document.createElement("div");
    row.className = "row";
    const ok = document.createElement("button");
    ok.className = "go";
    ok.type = "button";
    ok.textContent = "合併";
    const no = document.createElement("button");
    no.className = "dim";
    no.type = "button";
    no.textContent = "唔合";
    const err = document.createElement("p");
    err.className = "err";
    err.hidden = true;
    async function act(url) {
      err.hidden = true;
      const res = await fetch(url, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ a: pair.a, b: pair.b }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        err.hidden = false;
        err.textContent = body.error || "做唔到";
        return;
      }
      loadMerge();
    }
    ok.addEventListener("click", () => act("/api/merge-suggestions/accept"));
    no.addEventListener("click", () => act("/api/merge-suggestions/dismiss"));
    row.appendChild(ok);
    row.appendChild(no);
    art.appendChild(row);
    art.appendChild(err);
    return art;
  }));
}

document.getElementById("noteFilterClear").addEventListener("click", () => {
  setTagFilter("");
  loadNotes();
});

let stagedFiles = []; // { id, file, name, bytes, fileModifiedAt }
let pendingPasteConfirm = false;
let pendingFileDupFrom = -1;

function renderStaged() {
  const el = document.getElementById("dumpStaged");
  if (!stagedFiles.length) {
    el.hidden = true;
    el.replaceChildren();
    return;
  }
  el.hidden = false;
  el.replaceChildren(...stagedFiles.map((row) => {
    const li = document.createElement("li");
    const meta = document.createElement("div");
    meta.className = "staged-meta";
    const name = document.createElement("strong");
    name.textContent = row.name;
    const rest = document.createElement("span");
    const bits = [formatBytes(row.bytes)];
    if (row.fileModifiedAt) bits.push(formatHkDate(row.fileModifiedAt));
    rest.textContent = " · " + bits.join(" · ");
    meta.appendChild(name);
    meta.appendChild(rest);
    const rm = document.createElement("button");
    rm.type = "button";
    rm.className = "dim";
    rm.textContent = "移除";
    rm.addEventListener("click", () => {
      stagedFiles = stagedFiles.filter((x) => x.id !== row.id);
      renderStaged();
    });
    li.appendChild(meta);
    li.appendChild(rm);
    return li;
  }));
}

function stageFiles(fileList) {
  const files = [...(fileList || [])].filter(Boolean);
  if (!files.length) return;
  for (const file of files) {
    stagedFiles.push({
      id: String(Date.now()) + "-" + Math.random().toString(36).slice(2, 8),
      file,
      name: file.name || "file",
      bytes: file.size || 0,
      fileModifiedAt: file.lastModified ? new Date(file.lastModified).toISOString() : null,
    });
  }
  renderStaged();
}

function showIngestResult(msg, data, fileCount) {
  msg.hidden = false;
  const note = data.note || (data.results && data.results[0] && data.results[0].note);
  const question = data.question || (data.results || []).some((x) => x.question);
  if (note && note.classifyError) msg.textContent = note.classifyError;
  else if (question) {
    msg.classList.add("ok");
    msg.textContent = "已存，有待答問題";
  } else {
    msg.classList.add("ok");
    const n = fileCount != null ? fileCount : (data.results ? data.results.length : 1);
    msg.textContent = n > 1 ? "已存 " + n + " 個檔" : "已分類";
  }
}

async function ingestPasteOnly(confirmDup) {
  const msg = document.getElementById("dumpMsg");
  const dupEl = document.getElementById("dumpDup");
  const text = document.getElementById("dumpText").value;
  msg.hidden = true;
  msg.classList.remove("ok");
  dupEl.hidden = true;
  pendingPasteConfirm = false;
  pendingFileDupFrom = -1;
  const body = { text };
  if (confirmDup) body.confirm = true;
  const r = await fetch("/api/ingest", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({}));
  if (r.status === 409) {
    pendingPasteConfirm = true;
    dupEl.hidden = false;
    return { ok: false, dup: true };
  }
  if (!r.ok) {
    msg.hidden = false;
    msg.textContent = data.error || "存唔到";
    return { ok: false };
  }
  document.getElementById("dumpText").value = "";
  return { ok: true, data };
}

async function ingestStagedFiles(fromIndex, confirmDup) {
  const msg = document.getElementById("dumpMsg");
  const dupEl = document.getElementById("dumpDup");
  const results = [];
  let confirmNext = !!confirmDup;
  for (let i = Math.max(0, fromIndex | 0); i < stagedFiles.length; i++) {
    const row = stagedFiles[i];
    const file = row.file;
    const fd = new FormData();
    fd.append("file", file, row.name);
    if (row.fileModifiedAt) fd.append("fileModifiedAt", row.fileModifiedAt);
    if (confirmNext) fd.append("confirm", "true");
    const r = await fetch("/api/ingest-files", { method: "POST", body: fd });
    const data = await r.json().catch(() => ({}));
    if (r.status === 409) {
      pendingFileDupFrom = i;
      pendingPasteConfirm = false;
      dupEl.hidden = false;
      return { ok: false, dup: true, results };
    }
    if (!r.ok) {
      pendingFileDupFrom = -1;
      msg.hidden = false;
      msg.textContent = (data.error || "存唔到") + (row.name ? "（" + row.name + "）" : "");
      return { ok: false, results };
    }
    confirmNext = false;
    pendingFileDupFrom = -1;
    results.push(data);
  }
  return { ok: true, results };
}

async function dumpSave(confirmDup) {
  const msg = document.getElementById("dumpMsg");
  const dupEl = document.getElementById("dumpDup");
  msg.hidden = true;
  msg.classList.remove("ok");
  dupEl.hidden = true;

  const hasStaged = stagedFiles.length > 0;
  const text = document.getElementById("dumpText").value.trim();

  if (!hasStaged) {
    const out = await ingestPasteOnly(confirmDup);
    if (!out.ok) return;
    showIngestResult(msg, out.data);
    showTab("notes");
    loadNotes();
    refreshPendingBadge();
    return;
  }

  const start = confirmDup && pendingFileDupFrom >= 0 ? pendingFileDupFrom : 0;
  const fileOut = await ingestStagedFiles(start, confirmDup && pendingFileDupFrom >= 0);
  if (!fileOut.ok) return;

  let pasteData = null;
  if (text) {
    const pasteOut = await ingestPasteOnly(false);
    if (pasteOut.dup) {
      // files already ingested; keep staged cleared after we decide — wait until paste ok
      // leave staged as-is until paste confirmed? Files already saved — clear staged now
      stagedFiles = [];
      renderStaged();
      return;
    }
    if (!pasteOut.ok) {
      stagedFiles = [];
      renderStaged();
      return;
    }
    pasteData = pasteOut.data;
  }

  const fileCount = fileOut.results.length + (pasteData ? 1 : 0);
  stagedFiles = [];
  renderStaged();
  if (pasteData) showIngestResult(msg, pasteData, fileCount);
  else showIngestResult(msg, fileOut.results[fileOut.results.length - 1] || { results: fileOut.results }, fileCount);
  showTab("notes");
  loadNotes();
  refreshPendingBadge();
}

document.getElementById("dumpGo").addEventListener("click", () => {
  pendingFileDupFrom = -1;
  pendingPasteConfirm = false;
  dumpSave(false);
});
document.getElementById("dumpConfirm").addEventListener("click", () => {
  if (pendingFileDupFrom >= 0) {
    dumpSave(true);
    return;
  }
  if (pendingPasteConfirm) {
    ingestPasteOnly(true).then((out) => {
      if (!out.ok) return;
      const msg = document.getElementById("dumpMsg");
      showIngestResult(msg, out.data);
      showTab("notes");
      loadNotes();
      refreshPendingBadge();
    });
    return;
  }
  dumpSave(true);
});

const dumpPaper = document.getElementById("dumpPaper");
const dumpFile = document.getElementById("dumpFile");
document.getElementById("dumpPick").addEventListener("click", () => dumpFile.click());
dumpFile.addEventListener("change", () => {
  const list = dumpFile.files;
  if (list && list.length) stageFiles(list);
  dumpFile.value = "";
});
let dragDepth = 0;
dumpPaper.addEventListener("dragenter", (e) => {
  e.preventDefault();
  e.stopPropagation();
  dragDepth++;
  dumpPaper.classList.add("drag");
});
dumpPaper.addEventListener("dragover", (e) => {
  e.preventDefault();
  e.stopPropagation();
});
dumpPaper.addEventListener("dragleave", (e) => {
  e.preventDefault();
  e.stopPropagation();
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) dumpPaper.classList.remove("drag");
});
dumpPaper.addEventListener("drop", (e) => {
  e.preventDefault();
  e.stopPropagation();
  dragDepth = 0;
  dumpPaper.classList.remove("drag");
  const list = e.dataTransfer && e.dataTransfer.files;
  if (list && list.length) stageFiles(list);
});

document.getElementById("searchForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const el = document.getElementById("searchList");
  const q = document.getElementById("q").value;
  const r = await fetch("/api/search?q=" + encodeURIComponent(q));
  const data = await r.json();
  const notes = data.notes || [];
  const questions = data.questions || [];
  if (!notes.length && !questions.length) {
    el.className = "empty";
    el.textContent = "冇結果。";
    return;
  }
  el.className = "";
  const nodes = [];
  notes.forEach((n) => nodes.push(noteCard(n)));
  questions.forEach((item) => nodes.push(qCard(item)));
  el.replaceChildren(...nodes);
});

  const r = await fetch("/api/export");
  if (!r.ok) return;
  const blob = await r.blob();

  a.href = URL.createObjectURL(blob);
  a.download = "info-inbox-backup.json";
  a.click();
  URL.revokeObjectURL(a.href);
});
